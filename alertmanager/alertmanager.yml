# EDIT the 4 values marked CHANGE_ME before running.
global:
  slack_api_url: "https://hooks.slack.com/services/changeMe"   # CHANGE_ME (Slack webhook)
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "yourusername@gmail.com"              # CHANGE_ME
  smtp_auth_username: "yourusername@gmail.com"     # CHANGE_ME
  smtp_auth_password: "yourpassword"  # CHANGE_ME (Gmail App Password, not normal password)
  smtp_require_tls: true

route:
  receiver: team
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: team
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: |
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
    email_configs:
      - to: "yourusername@gmail.com"               # CHANGE_ME
        send_resolved: true
        headers:
          subject: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
